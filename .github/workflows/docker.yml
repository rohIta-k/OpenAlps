name: docker
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: track_2a
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          docker system prune -af
          df -h

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Download embedding model
        run: uv run python scripts/download_model.py

      - name: Build Docker image
        run: make run-mock DATA=data/sample

      - name: No secrets or .env baked into the image
        run: docker run --rm --entrypoint sh track2a -c 'test ! -f /app/.env && ! env | grep -qi api_key'

      - name: Validate the official output contract
        run: python3 scripts/validate_output.py --cases data/sample/cases.jsonl --predictions output/predictions.jsonl