name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: track_2a
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: track_2a/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Run lint
        run: uv run ruff check .